<style>
    html, body { margin: 0; height: 100%; background: #EAF4FB; }
    #ss-splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 22px;
      background: #EAF4FB; z-index: 9999; transition: opacity .35s ease;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #ss-splash img { width: 108px; height: 108px; border-radius: 26px;
      box-shadow: 0 10px 30px rgba(20,43,74,.15); animation: ss-pulse 1.6s ease-in-out infinite; }
    #ss-splash .ss-bar { width: 120px; height: 4px; border-radius: 2px; background: #D5DEE8; overflow: hidden; }
    #ss-splash .ss-bar::after { content: ""; display: block; width: 40%; height: 100%;
      background: #12B8A6; border-radius: 2px; animation: ss-slide 1.1s ease-in-out infinite; }
    #ss-splash.ss-hide { opacity: 0; pointer-events: none; }
    @keyframes ss-pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    @keyframes ss-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  </style>
</head>
<body>
  <div id="ss-splash" aria-label="Loading SplitSure">
    <img src="icons/Icon-512.png" alt="SplitSure">
    <div class="ss-bar"></div>
  </div>
  <script>
    window.addEventListener("flutter-first-frame", function () {
      var s = document.getElementById("ss-splash");
      if (!s) return;
      s.classList.add("ss-hide");
      setTimeout(function () { s.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
