name: splitsure
description: Protect your music. Promote your sound.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Navigation
  go_router: ^13.2.0
  flutter_web_plugins:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Supabase
  supabase_flutter: ^2.5.0

  # Storage / preferences
  shared_preferences: ^2.2.3

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Utils
  intl: ^0.20.2

  # PDF generation
  pdf: ^3.11.1
  printing: ^5.13.1
  path_provider: ^2.1.4

  # Web interop
  web: ^1.1.0

  # Firebase (push notifications only)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # File upload
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  http: ^1.2.2

  # Icons
  font_awesome_flutter: ^11.0.0

  # Animations
  lottie: ^3.1.2
  url_launcher: ^6.3.2
  share_plus: ^12.0.2

dependency_overrides:
  image: 4.5.4
  archive: 4.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  image: ^4.5.4 # used by tool/generate_icons.dart

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/images/SocialMedia/
    - assets/images/subscrib/
